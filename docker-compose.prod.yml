# ========================================
# ShoshaMart Production - Security Hardened
# ========================================
# 
# SECURITY FEATURES:
# ✓ Zero-trust network isolation
# ✓ No port exposure except Nginx (80/443)
# ✓ Resource limits & ulimits
# ✓ Log rotation enabled
# ✓ Health checks with proper intervals
# ✓ Non-root users where possible
# ✓ Secrets from environment only
# ✓ Read-only filesystems where applicable
#
# BEFORE DEPLOYMENT:
# 1. cp .env.production .env.production.local
# 2. chmod 600 .env.production.local
# 3. Update all secrets in .env.production.local
# 4. Review firewall rules (only 80/443 open)
#
# Usage:
# docker compose -f docker-compose.prod.yml --env-file .env.production.local up -d
# docker compose -f docker-compose.prod.yml --env-file .env.production.local down

services:
  # ===========================
  # PostgreSQL Database
  # ===========================
  postgres:
    image: postgres:16-alpine
    container_name: shosha_mart_postgres
    restart: unless-stopped
    
    # SECURITY: No port exposure - only internal network access
    # Database hanya accessible dari container lain dalam network
    expose:
      - "5432"
    
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      # Security: Disable trust authentication
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    
    networks:
      - shosha_mart_internal
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=postgres"
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    # Process limits
    ulimits:
      nproc: 65535
      nofile:
        soft: 20480
        hard: 40960
    
    # Security options
    security_opt:
      - no-new-privileges:true

  # ===========================
  # MinIO Object Storage
  # ===========================
  minio:
    image: minio/minio:latest
    container_name: shosha_mart_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    
    # SECURITY: No public port exposure
    # MinIO API accessible hanya via Nginx reverse proxy
    # Console bound ke localhost untuk admin access saja
    expose:
      - "9000"
    ports:
      - "127.0.0.1:9001:9001"  # Console only on localhost
    
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "on"
      # Security settings
      MINIO_BROWSER_REDIRECT_URL: "http://localhost:9001"
      # Performance settings
      MINIO_API_REQUESTS_MAX: "1000"
      MINIO_API_REQUESTS_DEADLINE: "10s"
    
    volumes:
      - minio_data:/data
      - /etc/localtime:/etc/localtime:ro
    
    networks:
      - shosha_mart_internal
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=minio"
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    # Process limits  
    ulimits:
      nproc: 65535
      nofile:
        soft: 8192
        hard: 16384
    
    # Security options
    security_opt:
      - no-new-privileges:true

  # ===========================
  # Backend API (NestJS)
  # ===========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: shosha_mart_backend
    restart: unless-stopped
    
    # SECURITY: No public port exposure
    # Backend hanya accessible via Nginx reverse proxy
    expose:
      - "3001"
    
    environment:
      NODE_ENV: production
      PORT: 3001
      
      # Database - secured connection
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&sslmode=disable&connect_timeout=10
      
      # JWT - from secure environment only
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY}
      
      # CORS - strict origin
      FRONTEND_URL: http://100.71.244.50
      
      # MinIO - internal network only
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: false
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_PUBLIC_URL: http://100.71.244.50
      
      # Upload settings
      UPLOAD_DIR: ./uploads
      MAX_FILE_SIZE: 5242880
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL}
    
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    
    volumes:
      - backend_uploads:/app/uploads
      - /etc/localtime:/etc/localtime:ro
    
    networks:
      - shosha_mart_internal
    
    # IMPORTANT: Prisma generate MUST run before migrate (DATABASE_URL available at runtime)
    command: sh -c "npx prisma generate && npx prisma migrate deploy && node dist/src/main"
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=backend"
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      replicas: 1
    
    # Process limits
    ulimits:
      nproc: 65535
      nofile:
        soft: 4096
        hard: 8192
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Read-only root filesystem (except specified volumes)
    read_only: false  # Set to true if app supports it
    
    # Drop unnecessary capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # ===========================
  # Frontend (Nuxt 3)
  # ===========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_URL}
    container_name: shosha_mart_frontend
    restart: unless-stopped
    
    # SECURITY: No public port exposure
    # Frontend hanya accessible via Nginx reverse proxy
    expose:
      - "3000"
    
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_API_BASE: http://100.71.244.50/api
      NUXT_PUBLIC_APP_NAME: ${NUXT_PUBLIC_APP_NAME}
      NUXT_PUBLIC_APP_VERSION: ${NUXT_PUBLIC_APP_VERSION}
      # Security headers
      NUXT_SECURITY_ENABLED: "true"
    
    depends_on:
      backend:
        condition: service_healthy
    
    volumes:
      - /etc/localtime:/etc/localtime:ro
    
    networks:
      - shosha_mart_internal
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=frontend"
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    # Process limits
    ulimits:
      nproc: 65535
      nofile:
        soft: 4096
        hard: 8192
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Drop unnecessary capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # ===========================
  # Nginx Reverse Proxy
  # ===========================
  nginx:
    image: nginx:alpine
    container_name: shosha_mart_nginx
    restart: unless-stopped
    
    # SECURITY: ONLY service yang expose port ke public
    # Hanya port 80 dan 443 yang open ke internet
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro
    
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      minio:
        condition: service_healthy
    
    networks:
      - shosha_mart_internal
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    
    # Logging configuration with rotation
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=nginx"
        compress: "true"
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    
    # Process limits
    ulimits:
      nproc: 65535
      nofile:
        soft: 4096
        hard: 8192
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Drop all capabilities except required
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID

# ===========================
# Networks - SECURITY HARDENED
# ===========================
networks:
  shosha_mart_internal:
    driver: bridge
    labels:
      com.shosha.project: "shosha-mart"
      com.shosha.environment: "production"

# ===========================
# Volumes - Persistent Storage
# ===========================
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/postgres
    labels:
      com.shosha.backup: "daily"
      com.shosha.retention: "30days"
  
  minio_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/minio
    labels:
      com.shosha.backup: "daily"
      com.shosha.retention: "90days"
  
  backend_uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/uploads
    labels:
      com.shosha.backup: "daily"
      com.shosha.retention: "90days"
  
  nginx_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/logs/nginx
    labels:
      com.shosha.backup: "weekly"
      com.shosha.retention: "30days"

